<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>MG-VMS Player</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: #0b0b0f; color: #e6e6e6; height: 100vh; display: flex; }
  aside { width: 280px; flex-shrink: 0; background: #111117; border-right: 1px solid #22222a; overflow-y: auto; }
  aside h1 { font-size: 14px; padding: 14px 14px 4px; margin: 0; letter-spacing: 0.05em; text-transform: uppercase; color: #8a8a94; }
  aside .meta { padding: 0 14px 12px; font-size: 11px; color: #6a6a74; border-bottom: 1px solid #22222a; margin-bottom: 8px; }
  .clip { padding: 10px 14px; cursor: pointer; border-left: 3px solid transparent; }
  .clip:hover { background: #1a1a22; }
  .clip.active { background: #1a1a2c; border-left-color: #0044FF; }
  .clip .name { font-weight: 600; font-size: 13px; }
  .clip .sub { font-size: 11px; color: #8a8a94; margin-top: 2px; }
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .player-wrap { flex: 1; display: flex; align-items: center; justify-content: center; background: #000; position: relative; }
  video { max-width: 100%; max-height: 100%; }
  .empty { color: #6a6a74; font-size: 14px; text-align: center; padding: 40px; }
  .infobar { padding: 10px 16px; background: #111117; border-top: 1px solid #22222a; font-size: 12px; color: #8a8a94; display: flex; gap: 16px; flex-wrap: wrap; }
  .infobar b { color: #e6e6e6; }
  .badge { display: inline-block; font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; padding: 2px 6px; border: 1px solid #333340; color: #8a8a94; margin-left: 6px; }
</style>
</head>
<body>
  <aside>
    <h1>MG-VMS Player</h1>
    <div class="meta" id="export-meta"></div>
    <div id="clip-list"></div>
  </aside>
  <main>
    <div class="player-wrap" id="player-wrap">
      <div class="empty">Sélectionnez une caméra à gauche</div>
    </div>
    <div class="infobar" id="infobar" style="display:none"></div>
  </main>

<script>
// Injecté par le backend au moment de la génération de l'export — voir
// backend/routers.py::create_export. Aucun fetch()/XHR : un player ouvert
// en double-clic (protocole file://) ne peut pas charger un JSON via
// fetch (bloqué par la sécurité du navigateur) — les métadonnées sont
// donc embarquées ICI en dur, seule la vidéo elle-même (<video src>)
// est chargée en local, ce qui reste autorisé pour ce type de ressource.
const EXPORT_DATA = __MGVMS_EXPORT_DATA__;

const listEl = document.getElementById("clip-list");
const wrapEl = document.getElementById("player-wrap");
const infoEl = document.getElementById("infobar");
const metaEl = document.getElementById("export-meta");

metaEl.innerHTML = `Exporté le ${new Date(EXPORT_DATA.created_at).toLocaleString()}<br>${EXPORT_DATA.range.start_label} → ${EXPORT_DATA.range.end_label}`;

function selectClip(clip, el) {
  document.querySelectorAll(".clip").forEach((c) => c.classList.remove("active"));
  el.classList.add("active");
  wrapEl.innerHTML = "";
  const video = document.createElement("video");
  video.src = clip.file;
  video.controls = true;
  video.autoplay = true;
  wrapEl.appendChild(video);
  infoEl.style.display = "flex";
  infoEl.innerHTML = `
    <span><b>${clip.camera_name}</b></span>
    <span>Site : <b>${clip.site_name || "—"}</b></span>
    <span>Durée : <b>${clip.duration_label}</b></span>
    <span>Taille : <b>${clip.size_mb} Mo</b></span>
    <span class="badge">${clip.codec}</span>
  `;
}

if (!EXPORT_DATA.clips.length) {
  listEl.innerHTML = '<div class="clip"><div class="sub">Aucun clip dans cet export.</div></div>';
} else {
  EXPORT_DATA.clips.forEach((clip, i) => {
    const el = document.createElement("div");
    el.className = "clip";
    el.innerHTML = `<div class="name">${clip.camera_name}</div><div class="sub">${clip.site_name || ""} · ${clip.duration_label} · ${clip.size_mb} Mo</div>`;
    el.addEventListener("click", () => selectClip(clip, el));
    listEl.appendChild(el);
    if (i === 0) el.click();
  });
}
</script>
</body>
</html>
