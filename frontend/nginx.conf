# ==============================================================================
# MG-VMS · Nginx reverse proxy · v1.0
# ==============================================================================
# Rôle :
#   - Servir le build React (SPA) sur / avec fallback index.html
#   - Reverse proxy /api /ws vers le backend FastAPI (Uvicorn:8001)
#   - Terminaison TLS sur 443 · Redirection 80 → 443 (sauf healthcheck)
#   - Cert auto-généré par docker-entrypoint.sh au premier boot
#
# Le certificat est monté depuis /mnt/storage/certs (voir docker-compose.yml).
# L'utilisateur peut le remplacer à chaud puis `docker compose restart frontend`.

# ─── Limites brute-force ───────────────────────────────────────────────
limit_req_zone $binary_remote_addr zone=login_zone:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=200r/s;

# ─── Upstream backend ──────────────────────────────────────────────────
upstream mgvms_backend {
    server backend:8001;
    keepalive 32;
}

# ─── HTTP :80 · Healthcheck local + redirection HTTPS ─────────────────
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Healthcheck compose (wget interne) — reste en clair
    location = / {
        # Si redirection HTTPS forcée activée → 301, sinon serve SPA
        set $https_force "${HTTPS_FORCE}";
        # Sans forcing, retourne 200 pour le healthcheck
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # Tout le reste redirigé en HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── HTTPS :443 · Point d'entrée client ───────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    # ── TLS ──
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:20m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ── Headers de sécurité OWASP ──
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(self), payment=(), usb=()" always;

    # ── Uploads (plaques, faces, plugins) ──
    client_max_body_size 50m;
    client_body_timeout  60s;
    keepalive_timeout    65s;

    # ── Compression ──
    gzip on;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    root /usr/share/nginx/html;
    index index.html;

    # ── Login rate-limit anti-brute ──
    location = /api/auth/login {
        limit_req zone=login_zone burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://mgvms_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── API générale ──
    # v1.0-rc4.4 · Les headers Upgrade sont propagés pour permettre au
    # WebSocket /api/ws (utilisé par le frontend pour temps réel) de
    # fonctionner via ce même bloc. Sans effet sur les requêtes HTTP
    # classiques (Upgrade vide côté client → transparent).
    location /api/ {
        limit_req zone=api_zone burst=200 nodelay;
        proxy_pass http://mgvms_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── WebSocket (SSE, temps réel) ──
    location /ws/ {
        proxy_pass http://mgvms_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── go2rtc proxy (UI + WebRTC signaling) ──
    location /go2rtc/ {
        rewrite ^/go2rtc/(.*)$ /$1 break;
        proxy_pass http://go2rtc:1984;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # ── Static assets (cache long) ──
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── SPA React (fallback pour toutes les routes client-side) ──
    location / {
        try_files $uri $uri/ /index.html;
    }

    # v3.19 · index.html référence les fichiers JS/CSS hashés (cache 1 an,
    # voir /static/ ci-dessus) — sans ce no-cache explicite, un navigateur
    # peut garder une ancienne copie d'index.html en cache et continuer à
    # pointer vers un ancien bundle après un déploiement, donnant
    # l'impression qu'un correctif livré n'est jamais arrivé (constaté le
    # 31/08 : correctif Centre caméras confirmé présent dans le bundle
    # servi, mais invisible pour l'utilisateur tant que son navigateur
    # gardait l'ancien index.html).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
