# ====================================================================
# MG-VMS — Architecture micro-services (PRODUCTION)
# ⚠️ Artefact de déploiement. NON exécutable dans la sandbox de dev.
# Destiné à un serveur de production (Docker + GPU optionnel pour l'IA).
#   Démarrage : cp .env.example .env && docker compose up -d
# ====================================================================
version: "3.9"

x-restart: &restart
  restart: unless-stopped

networks:
  mgvms:
    driver: bridge

volumes:
  pg_data:
  redis_data:
  minio_data:
  recordings:
  prometheus_data:
  grafana_data:
  loki_data:

services:
  # ---------------- Reverse proxy / SSL ----------------
  reverse-proxy:
    image: traefik:v3.1
    <<: *restart
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.le.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.le.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.le.acme.httpchallenge.entrypoint=web"
    ports: ["80:80", "443:443"]
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./reverse-proxy/letsencrypt:/letsencrypt"
    networks: [mgvms]

  # ---------------- Base de données ----------------
  postgres:
    image: postgres:16-alpine
    <<: *restart
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - "pg_data:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [mgvms]

  redis:
    image: redis:7-alpine
    <<: *restart
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis_data:/data"]
    networks: [mgvms]

  minio:
    image: minio/minio:latest
    <<: *restart
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes: ["minio_data:/data"]
    ports: ["9000:9000", "9001:9001"]
    networks: [mgvms]

  # ---------------- API backend ----------------
  app-api:
    build: { context: ./api }
    <<: *restart
    env_file: [.env]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`${DOMAIN}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls.certresolver=le"
      - "traefik.http.services.api.loadbalancer.server.port=8001"
    networks: [mgvms]

  # ---------------- Frontend ----------------
  frontend:
    build: { context: ./frontend }
    <<: *restart
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.front.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.front.entrypoints=websecure"
      - "traefik.http.routers.front.tls.certresolver=le"
      - "traefik.http.services.front.loadbalancer.server.port=80"
    networks: [mgvms]

  # ---------------- Workers (Celery) ----------------
  worker:
    build: { context: ./api }
    <<: *restart
    command: ["celery", "-A", "app.tasks.celery_app", "worker", "--loglevel=info", "--concurrency=4"]
    env_file: [.env]
    depends_on: [redis, postgres]
    networks: [mgvms]

  scheduler:
    build: { context: ./api }
    <<: *restart
    command: ["celery", "-A", "app.tasks.celery_app", "beat", "--loglevel=info"]
    env_file: [.env]
    depends_on: [redis]
    networks: [mgvms]

  # ---------------- Moteur vidéo (FFmpeg / go2rtc) ----------------
  ffmpeg-service:
    build: { context: ./ffmpeg }
    <<: *restart
    env_file: [.env]
    volumes: ["recordings:/recordings"]
    networks: [mgvms]

  recording-service:
    build: { context: ./recording }
    <<: *restart
    env_file: [.env]
    depends_on: [postgres, minio]
    volumes: ["recordings:/recordings"]
    networks: [mgvms]

  # ---------------- Moteur IA (GPU) ----------------
  ai-engine:
    build: { context: ./ai-engine }
    <<: *restart
    env_file: [.env]
    depends_on: [redis, postgres]
    # GPU NVIDIA : décommenter en production avec nvidia-container-toolkit
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - { driver: nvidia, count: 1, capabilities: [gpu] }
    networks: [mgvms]

  notification-service:
    build: { context: ./notification }
    <<: *restart
    env_file: [.env]
    depends_on: [redis]
    networks: [mgvms]

  # ---------------- Supervision réseau (ICMP/SNMP) ----------------
  network-monitor:
    build: { context: ./network-monitor }
    <<: *restart
    env_file: [.env]
    depends_on: [postgres, redis]
    # ICMP nécessite des capacités réseau étendues
    cap_add: ["NET_RAW", "NET_ADMIN"]
    networks: [mgvms]

  backup-service:
    build: { context: ./backup }
    <<: *restart
    env_file: [.env]
    depends_on: [postgres, minio]
    volumes: ["recordings:/recordings:ro"]
    networks: [mgvms]

  # ---------------- Monitoring ----------------
  prometheus:
    image: prom/prometheus:latest
    <<: *restart
    volumes:
      - "./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro"
      - "prometheus_data:/prometheus"
    networks: [mgvms]

  grafana:
    image: grafana/grafana:latest
    <<: *restart
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
    volumes:
      - "grafana_data:/var/lib/grafana"
      - "./monitoring/grafana-datasources.yml:/etc/grafana/provisioning/datasources/ds.yml:ro"
    networks: [mgvms]

  loki:
    image: grafana/loki:latest
    <<: *restart
    command: ["-config.file=/etc/loki/loki-config.yml"]
    volumes:
      - "./monitoring/loki-config.yml:/etc/loki/loki-config.yml:ro"
      - "loki_data:/loki"
    networks: [mgvms]

  alertmanager:
    image: prom/alertmanager:latest
    <<: *restart
    volumes:
      - "./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro"
    networks: [mgvms]
