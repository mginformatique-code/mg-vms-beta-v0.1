route:
  receiver: default
  group_by: ["alertname", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 3h
receivers:
  - name: default
    # Configurer un webhook vers notification-service pour relayer
    # vers Email/Discord/Telegram/MQTT.
    webhook_configs:
      - url: "http://notification-service:8080/alertmanager"
        send_resolved: true
