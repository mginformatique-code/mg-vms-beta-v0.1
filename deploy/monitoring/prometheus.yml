global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "mgvms-api"
    metrics_path: /api/metrics
    static_configs:
      - targets: ["app-api:8001"]
  - job_name: "ai-engine"
    static_configs:
      - targets: ["ai-engine:9100"]
  - job_name: "postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]
  - job_name: "node"
    static_configs:
      - targets: ["node-exporter:9100"]
