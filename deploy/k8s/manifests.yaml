# ====================================================================
# MG-VMS — Manifests Kubernetes (PRODUCTION)
# ⚠️ Artefact. Appliquer avec: kubectl apply -f k8s/manifests.yaml
# Suppose un cluster avec ingress-nginx + cert-manager + StorageClass + (GPU pour l'IA).
# ====================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: mgvms
---
apiVersion: v1
kind: Secret
metadata: { name: mgvms-secrets, namespace: mgvms }
type: Opaque
stringData:
  JWT_SECRET: "change_me"
  DATABASE_URL: "postgresql+psycopg://mgvms:change_me@postgres:5432/mgvms"
  REDIS_URL: "redis://redis:6379/0"
  CORS_ORIGINS: "https://vms.mon-domaine.fr"
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: postgres, namespace: mgvms }
spec:
  serviceName: postgres
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - { name: POSTGRES_USER, value: mgvms }
            - { name: POSTGRES_PASSWORD, value: change_me }
            - { name: POSTGRES_DB, value: mgvms }
          ports: [{ containerPort: 5432 }]
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 50Gi } }
---
apiVersion: v1
kind: Service
metadata: { name: postgres, namespace: mgvms }
spec:
  selector: { app: postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: redis, namespace: mgvms }
spec:
  replicas: 1
  selector: { matchLabels: { app: redis } }
  template:
    metadata: { labels: { app: redis } }
    spec:
      containers:
        - { name: redis, image: redis:7-alpine, ports: [{ containerPort: 6379 }] }
---
apiVersion: v1
kind: Service
metadata: { name: redis, namespace: mgvms }
spec:
  selector: { app: redis }
  ports: [{ port: 6379, targetPort: 6379 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: app-api, namespace: mgvms }
spec:
  replicas: 3
  selector: { matchLabels: { app: app-api } }
  template:
    metadata: { labels: { app: app-api } }
    spec:
      containers:
        - name: api
          image: registry.mon-domaine.fr/mgvms/api:latest
          envFrom: [{ secretRef: { name: mgvms-secrets } }]
          ports: [{ containerPort: 8001 }]
          readinessProbe: { httpGet: { path: /api/, port: 8001 }, initialDelaySeconds: 10, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /api/, port: 8001 }, initialDelaySeconds: 20, periodSeconds: 20 }
          resources: { requests: { cpu: "250m", memory: "512Mi" }, limits: { cpu: "1", memory: "1Gi" } }
---
apiVersion: v1
kind: Service
metadata: { name: app-api, namespace: mgvms }
spec:
  selector: { app: app-api }
  ports: [{ port: 8001, targetPort: 8001 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: frontend, namespace: mgvms }
spec:
  replicas: 2
  selector: { matchLabels: { app: frontend } }
  template:
    metadata: { labels: { app: frontend } }
    spec:
      containers:
        - { name: frontend, image: registry.mon-domaine.fr/mgvms/frontend:latest, ports: [{ containerPort: 80 }] }
---
apiVersion: v1
kind: Service
metadata: { name: frontend, namespace: mgvms }
spec:
  selector: { app: frontend }
  ports: [{ port: 80, targetPort: 80 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: ai-engine, namespace: mgvms }
spec:
  replicas: 1
  selector: { matchLabels: { app: ai-engine } }
  template:
    metadata: { labels: { app: ai-engine } }
    spec:
      containers:
        - name: ai-engine
          image: registry.mon-domaine.fr/mgvms/ai-engine:latest
          envFrom: [{ secretRef: { name: mgvms-secrets } }]
          resources:
            limits: { nvidia.com/gpu: 1 }   # nécessite le NVIDIA device plugin
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mgvms-ingress
  namespace: mgvms
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"   # WebSocket
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["vms.mon-domaine.fr"]
      secretName: mgvms-tls
  rules:
    - host: vms.mon-domaine.fr
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend: { service: { name: app-api, port: { number: 8001 } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: frontend, port: { number: 80 } } }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: app-api-hpa, namespace: mgvms }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: app-api }
  minReplicas: 3
  maxReplicas: 12
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 65 } }
