# MG-VMS · Reverse Proxy Nginx production (v0.5.1.b)
# =========================================================================
# Rôle :
#   - Terminaison TLS (Let's Encrypt via certbot)
#   - Redirection HTTP → HTTPS automatique
#   - Reverse-proxy vers backend (8001), go2rtc (1984/8555), frontend (80)
#   - Headers de sécurité OWASP (HSTS, CSP, X-Frame-Options, etc.)
#   - Buffering optimisé pour WebSocket + streams RTSP/WebRTC
#
# Certificats : montés en volume depuis /etc/letsencrypt (renew hebdo par certbot)
# Domaine     : fixé via env MGVMS_DOMAIN dans docker-compose.prod.yml

# ─── Rate limiting zone (login brute force) ─────────────────────────────
limit_req_zone $binary_remote_addr zone=login_zone:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=100r/s;

# ─── HTTP → HTTPS (sauf challenges ACME) ────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Challenge Let's Encrypt (HTTP-01) — reste en clair par nécessité
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Tout le reste redirigé en HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── HTTPS · Point d'entrée unique client ───────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    # ── Certificats Let's Encrypt ──
    ssl_certificate     /etc/letsencrypt/live/mgvms/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mgvms/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/mgvms/chain.pem;

    # ── Protocoles + ciphers modernes ──
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:20m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ── OCSP stapling ──
    ssl_stapling on;
    ssl_stapling_verify on;

    # ── Headers de sécurité OWASP ──────────────────────────────────
    # HSTS : forcer HTTPS pendant 1 an, incluant sous-domaines
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    # Empêche l'inclusion dans une iframe (clickjacking)
    add_header X-Frame-Options "DENY" always;
    # Empêche le MIME-sniffing
    add_header X-Content-Type-Options "nosniff" always;
    # Politique referrer minimale
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Désactive géolocalisation, micro, caméra (sauf ce que l'app demande explicitement)
    add_header Permissions-Policy "geolocation=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;
    # CSP : autorise self + WebSocket wss (nécessaire pour go2rtc WebRTC + FastAPI /ws)
    # 'unsafe-inline' script/style requis par React 19 + Tailwind runtime jusqu'à v0.5.2
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' fonts.gstatic.com; connect-src 'self' wss: https:; media-src 'self' blob:; frame-ancestors 'none'; form-action 'self'; base-uri 'self'; object-src 'none';" always;

    # ── Corps requêtes (uploads plaques, faces, plugins) ──
    client_max_body_size 50m;
    client_body_timeout 60s;
    keepalive_timeout 65s;

    # ── Gzip ──
    gzip on;
    gzip_types text/plain text/css text/javascript application/javascript application/json;
    gzip_min_length 512;

    # ── Login : rate limit brute-force (5 req/min/IP) ──────────────
    location = /api/auth/login {
        limit_req zone=login_zone burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8001;
        include /etc/nginx/proxy_backend.conf;
    }

    # ── API générale ──
    location /api/ {
        limit_req zone=api_zone burst=200 nodelay;
        proxy_pass http://backend:8001;
        include /etc/nginx/proxy_backend.conf;
    }

    # ── WebSocket backend (SSE, notifications) ──
    location /ws/ {
        proxy_pass http://backend:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        include /etc/nginx/proxy_backend.conf;
    }

    # ── go2rtc UI + WebRTC + HLS ──
    location /go2rtc/ {
        rewrite ^/go2rtc/(.*)$ /$1 break;
        proxy_pass http://go2rtc:1984;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        include /etc/nginx/proxy_backend.conf;
    }

    # ── Recordings statiques ──
    location /recordings/ {
        alias /app/recordings/;
        add_header Cache-Control "private, max-age=3600";
        # Authentification requise (délégué au backend via auth_request)
        auth_request /api/_internal/check_auth;
        auth_request_set $auth_status $upstream_status;
    }

    # ── Frontend React (SPA) ──
    location / {
        proxy_pass http://frontend:80;
        include /etc/nginx/proxy_backend.conf;
    }
}
