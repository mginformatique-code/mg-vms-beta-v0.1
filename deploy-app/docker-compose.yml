# ==============================================================================
# MG-VMS · deploy-app/docker-compose.yml · v1.0-rc4 · Production
# ==============================================================================
# Installation depuis un clone Git vierge :
#   cd deploy-app
#   cp .env.example .env            # adapter secrets + chemins
#   sudo mkdir -p /mnt/storage/{mongodb,models,crops,logs,certs,backups} \
#                 /mnt/storage/video-datastore/recordings
#   docker compose build --no-cache
#   docker compose up -d
#
# Règles v1.0 :
#   - AUCUN bind mount de code (le code est embarqué dans les images) ;
#   - volumes = données persistantes UNIQUEMENT (/mnt/storage/...) ;
#   - ordre de démarrage : mongo healthy → go2rtc healthy → redis healthy
#     → backend healthy (+ pipeline, démarré en parallèle, même dépendances)
#     → frontend.
#
# v3.27 · Phase 3 — scission réelle en 2 conteneurs : `backend` (process API
# FastAPI, CPU only) et `pipeline` (IA GPU-bound : YOLO + ANPR OCR sur les
# flux caméra), même image (mgvms-backend:latest), rôle sélectionné au
# démarrage par MGVMS_ROLE (voir backend/server.py::on_startup). `frontend`
# ne dépend que de `backend` healthy — l'appli reste utilisable (avec un
# snapshot pipeline "stale") même si `pipeline` n'est pas encore prêt.
#
# Pré-requis serveur : Docker Compose v2, NVIDIA Driver >= 550 +
# nvidia-container-toolkit (GPU — requis par le service `pipeline`, plus par
# `backend` depuis la Phase 3), ports 3000/8001/1984/8554/8555.

services:

  # ─── MongoDB · stockage documents ────────────────────────────────
  mongo:
    image: mongo:7.0
    container_name: mgvms-mongo
    restart: unless-stopped
    command:
      # v3.15 · 2 Go -> 8 Go. La base pèse 15,4 Go (les images sont stockées
      # en base64 DANS les documents) : avec 2 Go, le cache s'auto-évinçait
      # en permanence — 33 Go relus depuis le disque en 2 h 42, `mongod` à
      # 60 % d'un cœur et kswapd actif. L'hôte a 41 Go dont 28 disponibles ;
      # 8 Go couvre largement les index et les documents récents sans
      # rapprocher la machine de l'OOM (une occurrence constatée le 25/08).
      - --wiredTigerCacheSizeGB=8
    volumes:
      - ${MONGO_DATA_PATH:-/mnt/storage/mongodb}:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1})"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks: [mgvms]

  # ─── Redis · bus pub/sub pipeline IA ↔ API (temps réel) ──────────
  # v3.22 · Chantier séparation pipeline IA / serveur API (priorité #1,
  # 01/09) : le pipeline appelait jusqu'ici directement les connexions
  # WebSocket du process API en mémoire (broadcast_alert/
  # broadcast_ai_detections) — impossible à conserver une fois le
  # pipeline dans son propre process/conteneur. Redis pub/sub choisi
  # plutôt qu'un HTTP interne point-à-point : cible affichée = 50-100
  # caméras, potentiellement plusieurs workers pipeline ET plusieurs
  # répliques API plus tard — Redis découple producteurs/consommateurs
  # sans qu'ils se connaissent (HTTP point-à-point serait un problème de
  # découverte de service dès plus d'une instance de chaque côté).
  # Étape 1 (celle-ci) : pub/sub uniquement, tout reste dans le même
  # conteneur backend le temps de valider en conditions réelles — pas
  # de persistance nécessaire (fan-out volatile, rien à perdre au
  # redémarrage). Une future étape 2 (état partagé pour les diagnostics)
  # pourra réutiliser cette même instance.
  redis:
    image: redis:7.4-alpine
    container_name: mgvms-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [mgvms]

  # ─── go2rtc · moteur central de flux (RTSP → MJPEG preview) ──────
  # P0-fix · Solution B (Go2RTC + MJPEG) : ce service avait été retiré du
  # compose lors de la migration "video-engine-v3" (WHEP-only), mais le
  # code backend (streaming.py::register_camera_stream, live.mjpeg,
  # camera_status_loop) en dépend toujours et n'a jamais cessé de l'appeler.
  # Sans ce service, aucune caméra réelle ne peut afficher de preview.
  # Pas de MediaMTX : une seule techno de proxy vidéo, comme demandé.
  go2rtc:
    image: alexxit/go2rtc:1.9.9
    container_name: mgvms-go2rtc
    restart: unless-stopped
    ports:
      - "1984:1984"       # HTTP API + WebSocket
      - "8554:8554"       # RTSP
      - "8555:8555"       # WebRTC ICE TCP
      - "8555:8555/udp"   # WebRTC ICE UDP
    volumes:
      # P0-fix · PAS de :ro ici : go2rtc écrit dans ce fichier à chaque
      # PUT /api/streams pour persister les flux enregistrés dynamiquement
      # par MG-VMS (register_camera_stream). En lecture seule, tout
      # enregistrement échouait avec 400 "read-only file system" — aucun
      # rapport avec les identifiants caméra ni le code applicatif.
      - ./go2rtc.yaml:/config/go2rtc.yaml
      - ${RECORDINGS_PATH:-/mnt/storage/video-datastore/recordings}:/app/media:ro
      - ../media:/demo-media:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:1984/api"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks: [mgvms]

  # ─── Backend FastAPI (API, CPU only) ──────────────────────────────
  # v3.27 · Phase 3 — le pipeline IA (GPU) est scindé dans le service
  # `pipeline` ci-dessous. Ce conteneur ne sert plus que l'API HTTP/WS :
  # aucun de ses chemins de requête n'importe plus pipeline_v2/ai_engine
  # en direct (RPC/snapshot Redis établis aux étapes 2a-2d) — plus besoin
  # du GPU ni des variables d'environnement GPU-only ici (déplacées vers
  # `pipeline`).
  backend:
    build:
      context: ..                     # racine du repo (voir /.dockerignore)
      dockerfile: backend/Dockerfile
    image: mgvms-backend:latest
    container_name: mgvms-backend
    restart: unless-stopped
    # v3.22 · Console shell hôte (Debug) — le conteneur backend ouvre une
    # connexion SSH SORTANTE vers l'hôte via ce nom (mécanisme Docker
    # standard, disponible sur Linux depuis Docker 20.10 — pas de socket
    # Docker, pas de privilège supplémentaire). L'authentification reste
    # entièrement déléguée à sshd/PAM côté hôte, avec les identifiants
    # Linux réels saisis par l'utilisateur à chaque session.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mongo:
        condition: service_healthy
      go2rtc:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Europe/Paris}
      # ── Base MG-VMS ─────────────────────────────────────────
      MONGO_URL: ${MONGO_URL:-mongodb://mongo:27017}
      DB_NAME: ${DB_NAME:-mgvms}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:-please_change_this_secret_in_production}
      # v3.4 · Déclarée dans .env.example depuis longtemps référencée en
      # commentaire mais jamais passée ici — comme AI_INTERVAL_SECONDS
      # juste en dessous, la variable n'atteignait donc jamais le
      # conteneur quoi qu'on mette dans .env. crypto_utils.py retombe sur
      # JWT_SECRET si vide, donc aucune régression sur une install existante.
      MGVMS_ENCRYPTION_KEY: ${MGVMS_ENCRYPTION_KEY:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@mg-vms.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@2026}
      GO2RTC_URL: ${GO2RTC_URL:-http://go2rtc:1984}
      GO2RTC_RTSP: ${GO2RTC_RTSP:-rtsp://go2rtc:8554}
      # ── Recherche IA / Smart Search (v1.0-rc4) ──────────────
      # Clé LLM (Emergent Universal Key). Absente = /api/smart-search
      # retourne 503 SMART_SEARCH_LLM_NOT_CONFIGURED, la vue Events
      # continue de fonctionner (filtres classiques). Backend only.
      EMERGENT_LLM_KEY: ${EMERGENT_LLM_KEY-}
      # ── Chemins internes (mappés via volumes ci-dessous) ────
      RECORDINGS_DIR: /app/recordings
      MODEL_PATH: /models
      CROP_PATH: /crops
      LOG_PATH: /logs
      CERT_PATH: /certificates
      BACKUP_PATH: /backups
      # v3.27 · Phase 3 — sélectionne le rôle API (voir server.py::on_startup).
      MGVMS_ROLE: api
    ports:
      - "8001:8001"
    volumes:
      # DONNÉES uniquement — jamais de code (immutabilité de l'image)
      - ${RECORDINGS_PATH:-/mnt/storage/video-datastore/recordings}:/app/recordings
      - ${MODELS_PATH:-/mnt/storage/models}:/models
      - ${CROPS_PATH:-/mnt/storage/crops}:/crops
      - ${LOGS_PATH:-/mnt/storage/logs}:/logs
      - ${CERTS_PATH:-/mnt/storage/certs}:/certificates
      - ${BACKUPS_PATH:-/mnt/storage/backups}:/backups
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8001/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s          # imports torch/ultralytics/OCR longs
    networks: [mgvms]

  # ─── Pipeline IA (CUDA) — process séparé du serveur API ──────────
  # v3.27 · Phase 3 · Scission réelle backend API / pipeline IA. Même
  # image que 'backend' (mgvms-backend:latest) — pas de build: ici,
  # réutilise l'image déjà construite par le service 'backend' (même
  # Dockerfile/contexte, MGVMS_ROLE seul change le comportement au
  # démarrage — voir server.py::on_startup). GPU exclusivement ici :
  # le process API (backend) n'importe plus pipeline_v2/ai_engine en
  # direct depuis l'étape 2a-2d (Redis snapshot + RPC), donc n'a plus
  # besoin du GPU.
  pipeline:
    image: mgvms-backend:latest
    container_name: mgvms-pipeline
    restart: unless-stopped
    runtime: nvidia
    depends_on:
      mongo:
        condition: service_healthy
      go2rtc:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Europe/Paris}
      MONGO_URL: ${MONGO_URL:-mongodb://mongo:27017}
      DB_NAME: ${DB_NAME:-mgvms}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JWT_SECRET: ${JWT_SECRET:-please_change_this_secret_in_production}
      MGVMS_ENCRYPTION_KEY: ${MGVMS_ENCRYPTION_KEY:-}
      # v3.27 · REQUIS malgré leur non-usage direct côté pipeline_v2/ai_engine :
      # seed.py::seed() (appelé sans condition de rôle, voir server.py::on_startup
      # "unconditional") lit `os.environ["ADMIN_EMAIL"]` / `["ADMIN_PASSWORD"]`
      # en INDEXATION DIRECTE (pas de .get() ni de défaut) — leur absence fait
      # planter le process au démarrage avec un KeyError. seed() est idempotent
      # (skip si le compte admin existe déjà en base, voir commentaire v3.20 dans
      # seed.py) donc ce n'est PAS un risque de réinitialiser un mot de passe
      # déjà changé par l'utilisateur — mais la variable doit être présente pour
      # que l'appel ne lève pas d'exception non gérée avant même d'atteindre les
      # tâches propres au rôle pipeline.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@mg-vms.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@2026}
      GO2RTC_URL: ${GO2RTC_URL:-http://go2rtc:1984}
      GO2RTC_RTSP: ${GO2RTC_RTSP:-rtsp://go2rtc:8554}
      # ── GPU / CUDA / FFmpeg NVDEC ───────────────────────────
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-compute,utility,video}
      MGVMS_AI_HW_ACCEL: ${MGVMS_AI_HW_ACCEL:-auto}
      # v3.1.9 · Cadence de la boucle IA (secondes entre 2 cycles par caméra) —
      # 0.15s par défaut (~6-7 fps/caméra) sature le GIL du seul process
      # Python (--workers 1) qui sert aussi l'API HTTP, causant des latences
      # aléatoires de plusieurs secondes sur N'IMPORTE quel endpoint pendant
      # les cycles IA (confirmé : /dashboard/stats, /security/timeout,
      # /events touchés, pas seulement ANPR/recordings). Relevé ici pour
      # réduire la fréquence sans toucher au code — au prix d'une détection
      # légèrement moins réactive.
      #
      # v3.12 · Défaut abaissé 0.15 -> 0.03. La valeur 0.15 plafonnait
      # MATHÉMATIQUEMENT le pipeline à 6,7 images/s par caméra, quel que soit
      # le matériel. Elle avait été relevée pour contenir une saturation dont
      # la vraie cause vient d'être trouvée et corrigée : un appel HTTP
      # bloquant vers go2rtc exécuté à chaque image dans `_stage_roi`
      # (jusqu'à 8 s par image, cf. camera_worker.py). Une fois ce goulot
      # levé, 0.15 ne protégeait plus rien et bridait tout — mesuré :
      # 0,4 -> 5,6 images/s par caméra sur 6 caméras.
      # Un nouveau déploiement doit être performant sans réglage manuel.
      AI_INTERVAL_SECONDS: ${AI_INTERVAL_SECONDS:-0.03}
      # v3.27 · EMERGENT_LLM_KEY : confirmé (grep) utilisée uniquement par
      # des routes API (smart_search.py, llm_settings.py, vehicles.py),
      # pas par pipeline_v2/ai_engine — non strictement nécessaire ici.
      # Reprise quand même (comme les volumes ci-dessous) : dupliquer une
      # simple variable d'env sur un conteneur qui ne s'en sert pas est
      # sans risque, et évite un oubli si un futur module pipeline venait
      # à en avoir besoin.
      EMERGENT_LLM_KEY: ${EMERGENT_LLM_KEY-}
      RECORDINGS_DIR: /app/recordings
      MODEL_PATH: /models
      CROP_PATH: /crops
      LOG_PATH: /logs
      CERT_PATH: /certificates
      BACKUP_PATH: /backups
      # v3.27 · Phase 3 — sélectionne le rôle pipeline (voir server.py::on_startup).
      MGVMS_ROLE: pipeline
    volumes:
      - ${RECORDINGS_PATH:-/mnt/storage/video-datastore/recordings}:/app/recordings
      - ${MODELS_PATH:-/mnt/storage/models}:/models
      - ${CROPS_PATH:-/mnt/storage/crops}:/crops
      - ${LOGS_PATH:-/mnt/storage/logs}:/logs
      - ${CERTS_PATH:-/mnt/storage/certs}:/certificates
      - ${BACKUPS_PATH:-/mnt/storage/backups}:/backups
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8001/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s          # imports torch/ultralytics/OCR longs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, video]
    networks: [mgvms]

  # ─── Frontend React (build) + Nginx ──────────────────────────────
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      # v1.0-rc4.5 · Blindage : PAS d'args REACT_APP_BACKEND_URL.
      # Le frontend en prod utilise EXCLUSIVEMENT des URLs relatives
      # (/api, /ws) proxifiées par Nginx same-origin. Le Dockerfile fait
      # échouer le build si REACT_APP_BACKEND_URL est non-vide (garde 1)
      # et scanne le bundle pour vérifier l'absence d'URLs absolues vers
      # /api (garde 2). Aucune régression Mixed Content possible.
    image: mgvms-frontend:latest
    container_name: mgvms-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      MGVMS_HOSTNAME: ${MGVMS_HOSTNAME:-mg-vms.local}
      HTTPS_FORCE: ${HTTPS_FORCE:-false}
    ports:
      - "${FRONTEND_HTTP_PORT:-3000}:80"
      - "${FRONTEND_HTTPS_PORT:-3443}:443"
    volumes:
      # Certificats TLS (self-signed auto-généré au 1er boot si vide) —
      # HTTPS non bloquant pour cette étape.
      - ${CERTS_PATH:-/mnt/storage/certs}:/etc/nginx/certs
    healthcheck:
      test: ["CMD", "curl", "-fs", "-o", "/dev/null", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks: [mgvms]

# Aucun volume Docker nommé : bind mounts host explicites uniquement.
networks:
  mgvms:
    driver: bridge
    name: mgvms
