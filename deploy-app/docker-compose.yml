# MG-VMS — Déploiement Docker production (v0.4.4)
# ================================================================================
# Cette configuration N'UTILISE PLUS de volume Docker nommé. Toutes les
# données persistantes vivent sur des chemins host explicites (bind mounts).
#
#   MONGO_DATA_PATH   → base MongoDB   (SSD dédié recommandé)
#   RECORDINGS_PATH   → enregistrements vidéo (HDD dédié recommandé)
#
# Défauts en développement (Linux dev laptop) :
#     MONGO_DATA_PATH=./data/mongo
#     RECORDINGS_PATH=./data/recordings
#
# Défauts en production (host cible) :
#     MONGO_DATA_PATH=/mnt/mongodb
#     RECORDINGS_PATH=/mnt/video-datastore/recordings
#
# Ces valeurs sont surchargées via un fichier ``.env`` à côté de ce fichier :
#     cp .env.example .env
#     # éditer .env pour production
#     docker compose up -d --build
#
# Pré-requis serveur (production) :
#   - Ubuntu 24.04 LTS
#   - NVIDIA Driver >= 550 (support CUDA 12.4)
#   - nvidia-container-toolkit installé
#   - `docker run --rm --gpus all nvidia/cuda:12.4.1-runtime-ubuntu22.04 nvidia-smi` OK
#   - Ports LAN ouverts : 3000 (UI), 8001 (API), 1984 (go2rtc UI), 8554 (RTSP),
#                          8555 TCP+UDP (WebRTC)
#   - Point de montage `/mnt/mongodb` (SSD ext4 dédié)
#   - Point de montage `/mnt/video-datastore/recordings` (HDD ext4 dédié)

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      # Bind mount host → conteneur : MongoDB écrit directement sur le SSD dédié.
      # v0.4.4 · suppression définitive du volume Docker nommé `mongo_data`.
      - ${MONGO_DATA_PATH:-./data/mongo}:/data/db
    networks: [mgvms]

  # ─── go2rtc : moteur central de flux vidéo ──────────────────────────────
  go2rtc:
    image: alexxit/go2rtc:1.9.9
    restart: unless-stopped
    volumes:
      - ./go2rtc.yaml:/config/go2rtc.yaml
      # v0.4.4 · unification : le dossier ``recordings`` du HDD est exposé aux
      # deux services en lecture (go2rtc pour streaming des replays,
      # backend pour l'écriture des enregistrements et vignettes).
      - ${RECORDINGS_PATH:-./data/recordings}:/app/media:ro
    ports:
      - "1984:1984"       # HTTP API + WebSocket
      - "8554:8554"       # RTSP (VLC / clients directs)
      - "8555:8555"       # WebRTC ICE TCP
      - "8555:8555/udp"   # WebRTC ICE UDP
    networks: [mgvms]

  # ─── Backend FastAPI (Python 3.11 · torch cu124 · FFmpeg CUDA) ─────────
  backend:
    build:
      context: ..                     # racine du repo
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    runtime: nvidia
    environment:
      # ── Base MG-VMS ─────────────────────────────────────────
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: ${DB_NAME:-mgvms}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://192.168.1.21:3000,http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:-please_change_this_secret_in_production}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@mg-vms.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@2026}
      GO2RTC_URL: ${GO2RTC_URL:-http://go2rtc:1984}
      GO2RTC_RTSP: ${GO2RTC_RTSP:-rtsp://go2rtc:8554}
      # ── GPU / CUDA / FFmpeg NVDEC ───────────────────────────
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,video
      MGVMS_AI_HW_ACCEL: ${MGVMS_AI_HW_ACCEL:-auto}
      GO2RTC_FFMPEG_CUDA: ${GO2RTC_FFMPEG_CUDA:-0}
    volumes:
      # v0.4.4 · Enregistrements sur HDD dédié (jamais dans un volume nommé).
      - ${RECORDINGS_PATH:-./data/recordings}:/app/recordings
    depends_on:
      - mongo
      - go2rtc
    ports:
      - "8001:8001"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, video]
    networks: [mgvms]

  frontend:
    build:
      context: ../frontend
      args:
        REACT_APP_BACKEND_URL: ${REACT_APP_BACKEND_URL:-http://192.168.1.21:8001}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks: [mgvms]

# v0.4.4 · Bloc `volumes:` supprimé — plus AUCUN volume Docker nommé.
# MongoDB et enregistrements utilisent exclusivement des bind mounts host.

networks:
  mgvms:
    driver: bridge
