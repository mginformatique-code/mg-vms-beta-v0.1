# MG-VMS — Déploiement Docker de l'application réelle (FastAPI + React + MongoDB)
# Démarrage : cp .env.example .env  &&  docker compose up -d --build
# Frontend : http://localhost:3000   ·   API : http://localhost:8001/api/

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks: [mgvms]

  go2rtc:
    image: alexxit/go2rtc:1.9.8
    restart: unless-stopped
    volumes:
      - ./go2rtc.yaml:/config/go2rtc.yaml
      - ../media:/app/media:ro
    # Conseillé sur Linux pour l'accès direct aux caméras du LAN + découverte ONVIF :
    # network_mode: host   (et mettre GO2RTC_URL=http://localhost:1984 côté backend)
    networks: [mgvms]

  backend:
    build:
      context: ../backend
    restart: unless-stopped
    environment:
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: ${DB_NAME:-mgvms}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:-please_change_this_secret}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@mg-vms.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@2026}
      GO2RTC_URL: ${GO2RTC_URL:-http://go2rtc:1984}
    depends_on:
      - mongo
      - go2rtc
    ports:
      - "8001:8001"
    networks: [mgvms]

  frontend:
    build:
      context: ../frontend
      args:
        REACT_APP_BACKEND_URL: ${REACT_APP_BACKEND_URL:-http://localhost:8001}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks: [mgvms]

volumes:
  mongo_data:

networks:
  mgvms:
    driver: bridge
