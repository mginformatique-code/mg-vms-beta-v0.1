# ==============================================================================
# MG-VMS · deploy-app/docker-compose.yml · v1.0-rc4 · Production
# ==============================================================================
# Installation depuis un clone Git vierge :
#   cd deploy-app
#   cp .env.example .env            # adapter secrets + chemins
#   sudo mkdir -p /mnt/storage/{mongodb,models,crops,logs,certs,backups} \
#                 /mnt/storage/video-datastore/recordings
#   docker compose build --no-cache
#   docker compose up -d
#
# Règles v1.0 :
#   - AUCUN bind mount de code (le code est embarqué dans les images) ;
#   - volumes = données persistantes UNIQUEMENT (/mnt/storage/...) ;
#   - ordre de démarrage : mongo healthy → go2rtc healthy → backend healthy
#     → frontend.
#
# Pré-requis serveur : Docker Compose v2, NVIDIA Driver >= 550 +
# nvidia-container-toolkit (GPU), ports 3000/8001/1984/8554/8555.

services:

  # ─── MongoDB · stockage documents ────────────────────────────────
  mongo:
    image: mongo:7.0
    container_name: mgvms-mongo
    restart: unless-stopped
    command:
      - --wiredTigerCacheSizeGB=2
    volumes:
      - ${MONGO_DATA_PATH:-/mnt/storage/mongodb}:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1})"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks: [mgvms]

  # video-engine-v3 · Services go2rtc & MediaMTX SUPPRIMÉS.
  # Le moteur vidéo est désormais 100% intégré au backend (video_core PyAV +
  # webrtc_gateway aiortc). Une seule connexion RTSP par caméra, WHEP servi
  # nativement par FastAPI. Zéro proxy vidéo.

  # ─── Backend FastAPI + Pipeline IA (CUDA) ────────────────────────
  backend:
    build:
      context: ..                     # racine du repo (voir /.dockerignore)
      dockerfile: backend/Dockerfile
    image: mgvms-backend:latest
    container_name: mgvms-backend
    restart: unless-stopped
    runtime: nvidia
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Europe/Paris}
      # ── Base MG-VMS ─────────────────────────────────────────
      MONGO_URL: ${MONGO_URL:-mongodb://mongo:27017}
      DB_NAME: ${DB_NAME:-mgvms}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:-please_change_this_secret_in_production}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@mg-vms.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@2026}
      # video-engine-v3 · Moteur vidéo intégré au backend (aiortc + PyAV).
      # Aucune dépendance externe go2rtc/MediaMTX.
      # ── GPU / CUDA / FFmpeg NVDEC ───────────────────────────
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-compute,utility,video}
      MGVMS_AI_HW_ACCEL: ${MGVMS_AI_HW_ACCEL:-auto}
      # ── Recherche IA / Smart Search (v1.0-rc4) ──────────────
      # Clé LLM (Emergent Universal Key). Absente = /api/smart-search
      # retourne 503 SMART_SEARCH_LLM_NOT_CONFIGURED, la vue Events
      # continue de fonctionner (filtres classiques). Backend only.
      EMERGENT_LLM_KEY: ${EMERGENT_LLM_KEY-}
      # ── Chemins internes (mappés via volumes ci-dessous) ────
      RECORDINGS_DIR: /app/recordings
      MODEL_PATH: /models
      CROP_PATH: /crops
      LOG_PATH: /logs
      CERT_PATH: /certificates
      BACKUP_PATH: /backups
    ports:
      - "8001:8001"
    volumes:
      # DONNÉES uniquement — jamais de code (immutabilité de l'image)
      - ${RECORDINGS_PATH:-/mnt/storage/video-datastore/recordings}:/app/recordings
      - ${MODELS_PATH:-/mnt/storage/models}:/models
      - ${CROPS_PATH:-/mnt/storage/crops}:/crops
      - ${LOGS_PATH:-/mnt/storage/logs}:/logs
      - ${CERTS_PATH:-/mnt/storage/certs}:/certificates
      - ${BACKUPS_PATH:-/mnt/storage/backups}:/backups
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8001/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s          # imports torch/ultralytics/OCR longs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, video]
    networks: [mgvms]

  # ─── Frontend React (build) + Nginx ──────────────────────────────
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      # v1.0-rc4.5 · Blindage : PAS d'args REACT_APP_BACKEND_URL.
      # Le frontend en prod utilise EXCLUSIVEMENT des URLs relatives
      # (/api, /ws) proxifiées par Nginx same-origin. Le Dockerfile fait
      # échouer le build si REACT_APP_BACKEND_URL est non-vide (garde 1)
      # et scanne le bundle pour vérifier l'absence d'URLs absolues vers
      # /api (garde 2). Aucune régression Mixed Content possible.
    image: mgvms-frontend:latest
    container_name: mgvms-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      MGVMS_HOSTNAME: ${MGVMS_HOSTNAME:-mg-vms.local}
      HTTPS_FORCE: ${HTTPS_FORCE:-false}
    ports:
      - "${FRONTEND_HTTP_PORT:-3000}:80"
      - "${FRONTEND_HTTPS_PORT:-3443}:443"
    volumes:
      # Certificats TLS (self-signed auto-généré au 1er boot si vide) —
      # HTTPS non bloquant pour cette étape.
      - ${CERTS_PATH:-/mnt/storage/certs}:/etc/nginx/certs
    healthcheck:
      test: ["CMD", "curl", "-fs", "-o", "/dev/null", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks: [mgvms]

# Aucun volume Docker nommé : bind mounts host explicites uniquement.
networks:
  mgvms:
    driver: bridge
    name: mgvms
