apiVersion: mgvms.io/v1
kind: Plugin
metadata:
  name: dwell-time
  displayName: "Temps passé (dwell time)"
  version: "1.0.0"
  description: "Mesure le temps passé par personne dans une zone (rayon magasin, vitrine)."
  author: "MG-VMS Team"
  license: "MIT"
  categories: [commerce]
  providerGroup: commerce
spec:
  runtime: python
  entrypoint: plugin.py
  className: DwellTimePlugin
  interface: FrameAnalyzer
  compatibility: {mgvms_core: ">=2.30.0,<4.0.0"}
  capabilities: [camera.frame.read, event.write]
  resources: {cpu_cores: 0.5, ram_mb: 150, gpu: none, disk_mb: 30}
  dependencies:
    python: []
  config_schema: config/schema.json
  bus:
    order: 112
