apiVersion: mgvms.io/v1
kind: Plugin
metadata:
  name: bytetrack
  displayName: "ByteTrack"
  version: "1.0.0"
  description: "Tracker BYTE — utilise toutes les détections (haute + basse conf). Défaut Ultralytics."
  author: "MG-VMS Team"
  license: "MIT"
  categories: [tracking]
  providerGroup: tracking
spec:
  runtime: python
  entrypoint: plugin.py
  className: ByteTrackPlugin
  interface: Tracker
  compatibility: {mgvms_core: ">=2.30.0,<4.0.0"}
  capabilities: [camera.frame.read, event.write]
  resources: {cpu_cores: 1, ram_mb: 300, gpu: optional, disk_mb: 100}
  dependencies:
    python: ["ultralytics"]
  config_schema: config/schema.json
  bus:
    order: 50
