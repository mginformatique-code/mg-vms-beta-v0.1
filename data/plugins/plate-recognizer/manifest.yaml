apiVersion: mgvms.io/v1
kind: Plugin
metadata:
  name: plate-recognizer
  displayName: "Plate Recognizer (cloud)"
  version: "1.0.0"
  description: "ANPR cloud haute précision (platerecognizer.com). Nécessite un token API. Support multi-régions et quota mensuel."
  author: "MG-VMS Team"
  license: "MIT"
  categories: [anpr]
  providerGroup: anpr
spec:
  runtime: python
  entrypoint: plugin.py
  className: PlateRecognizerPlugin
  interface: PlateRecognizer
  compatibility:
    mgvms_core: ">=2.30.0,<4.0.0"
  capabilities: [camera.frame.read, event.write, network.outbound]
  resources: {cpu_cores: 0.5, ram_mb: 128, gpu: none, disk_mb: 10}
  config_schema: config/schema.json
  bus:
    order: 30
