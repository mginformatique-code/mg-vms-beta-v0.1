apiVersion: mgvms.io/v1
kind: Plugin
metadata:
  name: smtp-notifier
  displayName: "SMTP Email Notifier"
  version: "1.0.0"
  description: "Envoi d'alertes par email SMTP (Gmail, Outlook, serveur privé)."
  author: "MG-VMS Team"
  license: "MIT"
  categories: [notifications]
  providerGroup: notifications
spec:
  runtime: python
  entrypoint: plugin.py
  className: SmtpNotifierPlugin
  interface: EventConsumer
  compatibility: {mgvms_core: ">=2.30.0,<4.0.0"}
  capabilities: [event.read, network.outbound]
  resources: {cpu_cores: 0.1, ram_mb: 32, gpu: none, disk_mb: 5}
  dependencies:
    python: []
  config_schema: config/schema.json
  bus:
    order: 202
