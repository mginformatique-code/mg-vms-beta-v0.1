apiVersion: mgvms.io/v1
kind: Plugin
metadata:
  name: tensorrt-detector
  displayName: "TensorRT (NVIDIA)"
  version: "1.0.0"
  description: "NVIDIA TensorRT — inférence ultra-rapide GPU RTX/Jetson. Nécessite conversion .trt/.engine préalable."
  author: "MG-VMS Team"
  license: "MIT"
  categories: [object-detection]
  providerGroup: object-detection
spec:
  runtime: python
  entrypoint: plugin.py
  className: TensorRtPlugin
  interface: FrameAnalyzer
  compatibility: {mgvms_core: ">=2.30.0,<4.0.0"}
  capabilities: [camera.frame.read, event.write]
  resources: {cpu_cores: 1, ram_mb: 800, gpu: optional, vram_mb: 2048, disk_mb: 500}
  dependencies:
    python: ["tensorrt", "pycuda"]
  config_schema: config/schema.json
  bus:
    order: 17
