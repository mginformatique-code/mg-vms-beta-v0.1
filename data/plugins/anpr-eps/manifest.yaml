apiVersion: mgvms.io/v1
kind: Plugin
metadata:
  name: anpr-eps
  displayName: "ANPR — Cycle Entrée/Présence/Sortie"
  version: "1.0.0"
  description: "Machine à états ANPR : émet UN événement 'plate_entered' quand une plaque apparaît, garde silence pendant la 'présence' (véhicule stationné ou passe régulièrement), et émet 'plate_exited' quand la plaque n'est plus vue depuis N secondes. Fini les 1000 événements pour la même voiture."
  author: "MG-VMS Team"
  license: "MIT"
  categories: [anpr]
  providerGroup: anpr
spec:
  runtime: python
  entrypoint: plugin.py
  className: AnprEpsPlugin
  interface: PipelineConsumer
  compatibility: {mgvms_core: ">=2.30.0,<4.0.0"}
  capabilities: [camera.frame.read, event.write, plugin.data.write]
  resources: {cpu_cores: 0.05, ram_mb: 32, gpu: none, disk_mb: 5}
  config_schema: config/schema.json
  bus:
    order: 50
