apiVersion: mgvms.io/v1
kind: Plugin
metadata:
  name: weapon-detection
  displayName: "Détection d'armes"
  version: "1.0.0"
  description: "Détection d'armes à feu / couteaux — sites sensibles, écoles, événements."
  author: "MG-VMS Team"
  license: "MIT"
  categories: [security]
  providerGroup: security
spec:
  runtime: python
  entrypoint: plugin.py
  className: WeaponDetectionPlugin
  interface: FrameAnalyzer
  compatibility: {mgvms_core: ">=2.30.0,<4.0.0"}
  capabilities: [camera.frame.read, event.write]
  resources: {cpu_cores: 1, ram_mb: 600, gpu: optional, disk_mb: 300}
  dependencies:
    python: ["ultralytics"]
  config_schema: config/schema.json
  bus:
    order: 92
