apiVersion: mgvms.io/v1
kind: Plugin
metadata:
  name: farm-intrusion
  displayName: "Intrusion agricole"
  version: "1.0.0"
  description: "Détection d'intrusion humaine / véhicule sur exploitation (mode nuit)."
  author: "MG-VMS Team"
  license: "MIT"
  categories: [agriculture]
  providerGroup: agriculture
spec:
  runtime: python
  entrypoint: plugin.py
  className: FarmIntrusionPlugin
  interface: PipelineConsumer
  compatibility: {mgvms_core: ">=2.30.0,<4.0.0"}
  capabilities: [camera.frame.read, event.write]
  resources: {cpu_cores: 0.5, ram_mb: 200, gpu: none, disk_mb: 50}
  dependencies:
    python: []
  config_schema: config/schema.json
  bus:
    order: 122
