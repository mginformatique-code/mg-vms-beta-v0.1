apiVersion: mgvms.io/v1
kind: Plugin
metadata:
  name: ocsort
  displayName: "OC-SORT"
  version: "1.0.0"
  description: "Observation-Centric SORT — robuste aux occlusions."
  author: "MG-VMS Team"
  license: "MIT"
  categories: [tracking]
  providerGroup: tracking
spec:
  runtime: python
  entrypoint: plugin.py
  className: OcSortPlugin
  interface: Tracker
  compatibility: {mgvms_core: ">=2.30.0,<4.0.0"}
  capabilities: [camera.frame.read, event.write]
  resources: {cpu_cores: 1, ram_mb: 400, gpu: optional, disk_mb: 100}
  dependencies:
    python: ["ocsort"]
  config_schema: config/schema.json
  bus:
    order: 54
