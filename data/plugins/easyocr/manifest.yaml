apiVersion: mgvms.io/v1
kind: Plugin
metadata:
  name: easyocr
  displayName: "EasyOCR (local)"
  version: "1.0.0"
  description: "OCR local EasyOCR (Jaided AI). 80+ langues. CPU/GPU."
  author: "MG-VMS Team"
  license: "Apache-2.0"
  categories: [ai, anpr, local]
spec:
  runtime: python
  entrypoint: plugin.py
  className: EasyOCRPlugin
  interface: PlateRecognizer
  compatibility: {mgvms_core: ">=2.30.0,<4.0.0"}
  capabilities: [camera.frame.read, event.write]
  resources: {cpu_cores: 1, ram_mb: 600, gpu: optional, vram_mb: 1024, disk_mb: 500}
  config_schema: config/schema.json
  bus:
    order: 41
