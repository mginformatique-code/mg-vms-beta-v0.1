apiVersion: mgvms.io/v1
kind: Plugin
metadata:
  name: occupancy
  displayName: "Occupation de zone"
  version: "1.0.0"
  description: "Compte le nombre d'objets présents dans une zone à un instant T."
  author: "MG-VMS Team"
  license: "MIT"
  categories: [counting]
  providerGroup: counting
spec:
  runtime: python
  entrypoint: plugin.py
  className: OccupancyPlugin
  interface: FrameAnalyzer
  compatibility: {mgvms_core: ">=2.30.0,<4.0.0"}
  capabilities: [camera.frame.read, event.write]
  resources: {cpu_cores: 0.3, ram_mb: 64, gpu: none, disk_mb: 10}
  dependencies:
    python: []
  config_schema: config/schema.json
  bus:
    order: 72
