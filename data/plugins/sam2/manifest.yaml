apiVersion: mgvms.io/v1
kind: Plugin
metadata:
  name: sam2
  displayName: "SAM 2 (Segment Anything)"
  version: "1.0.0"
  description: "Segment Anything Model 2 (Meta) — segmentation universelle sans classes prédéfinies."
  author: "MG-VMS Team"
  license: "MIT"
  categories: [segmentation]
  providerGroup: segmentation
spec:
  runtime: python
  entrypoint: plugin.py
  className: Sam2Plugin
  interface: Segmenter
  compatibility: {mgvms_core: ">=2.30.0,<4.0.0"}
  capabilities: [camera.frame.read, event.write]
  resources: {cpu_cores: 2, ram_mb: 2048, gpu: required, disk_mb: 2500}
  dependencies:
    python: ["sam2"]
  config_schema: config/schema.json
  bus:
    order: 60
