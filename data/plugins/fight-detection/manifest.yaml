apiVersion: mgvms.io/v1
kind: Plugin
metadata:
  name: fight-detection
  displayName: "Détection de bagarre"
  version: "1.0.0"
  description: "Détection de comportements violents (mouvements brusques, agression)."
  author: "MG-VMS Team"
  license: "MIT"
  categories: [security]
  providerGroup: security
spec:
  runtime: python
  entrypoint: plugin.py
  className: FightDetectionPlugin
  interface: FrameAnalyzer
  compatibility: {mgvms_core: ">=2.30.0,<4.0.0"}
  capabilities: [camera.frame.read, event.write]
  resources: {cpu_cores: 1, ram_mb: 500, gpu: optional, disk_mb: 300}
  dependencies:
    python: []
  config_schema: config/schema.json
  bus:
    order: 93
