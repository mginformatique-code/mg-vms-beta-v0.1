apiVersion: mgvms.io/v1
kind: Plugin
metadata:
  name: fall-detection
  displayName: "Détection de chute"
  version: "1.0.0"
  description: "Détection de chute (EHPAD, hôpitaux, sites industriels)."
  author: "MG-VMS Team"
  license: "MIT"
  categories: [security]
  providerGroup: security
spec:
  runtime: python
  entrypoint: plugin.py
  className: FallDetectionPlugin
  interface: PipelineConsumer
  compatibility: {mgvms_core: ">=2.30.0,<4.0.0"}
  capabilities: [camera.frame.read, event.write]
  resources: {cpu_cores: 1, ram_mb: 400, gpu: optional, disk_mb: 200}
  dependencies:
    python: []
  config_schema: config/schema.json
  bus:
    order: 94
