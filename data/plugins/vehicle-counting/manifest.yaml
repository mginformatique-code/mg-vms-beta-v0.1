apiVersion: mgvms.io/v1
kind: Plugin
metadata:
  name: vehicle-counting
  displayName: "Comptage de véhicules"
  version: "1.0.0"
  description: "Compte les véhicules par type (voiture/camion/moto/bus) sur une ligne."
  author: "MG-VMS Team"
  license: "MIT"
  categories: [counting]
  providerGroup: counting
spec:
  runtime: python
  entrypoint: plugin.py
  className: VehicleCountingPlugin
  interface: PipelineConsumer
  compatibility: {mgvms_core: ">=2.30.0,<4.0.0"}
  capabilities: [camera.frame.read, event.write]
  resources: {cpu_cores: 0.5, ram_mb: 128, gpu: none, disk_mb: 20}
  dependencies:
    python: []
  config_schema: config/schema.json
  bus:
    order: 71
