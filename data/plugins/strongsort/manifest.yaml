apiVersion: mgvms.io/v1
kind: Plugin
metadata:
  name: strongsort
  displayName: "StrongSORT"
  version: "1.0.0"
  description: "StrongSORT — DeepSORT amélioré avec ReID plus fort (OSNet)."
  author: "MG-VMS Team"
  license: "MIT"
  categories: [tracking]
  providerGroup: tracking
spec:
  runtime: python
  entrypoint: plugin.py
  className: StrongSortPlugin
  interface: Tracker
  compatibility: {mgvms_core: ">=2.30.0,<4.0.0"}
  capabilities: [camera.frame.read, event.write]
  resources: {cpu_cores: 1, ram_mb: 600, gpu: optional, disk_mb: 200}
  dependencies:
    python: ["strongsort"]
  config_schema: config/schema.json
  bus:
    order: 53
