apiVersion: mgvms.io/v1
kind: Plugin
metadata:
  name: openalpr
  displayName: "OpenALPR (cloud)"
  version: "1.0.0"
  description: "ANPR cloud OpenALPR (api.openalpr.com). Nécessite secret_key."
  author: "MG-VMS Team"
  license: "MIT"
  categories: [anpr]
  providerGroup: anpr
spec:
  runtime: python
  entrypoint: plugin.py
  className: OpenALPRPlugin
  interface: PlateRecognizer
  compatibility: {mgvms_core: ">=2.30.0,<4.0.0"}
  capabilities: [camera.frame.read, event.write, network.outbound]
  resources: {cpu_cores: 0.5, ram_mb: 128, gpu: none, disk_mb: 10}
  config_schema: config/schema.json
  bus:
    order: 31
