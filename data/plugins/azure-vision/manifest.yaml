apiVersion: mgvms.io/v1
kind: Plugin
metadata:
  name: azure-vision
  displayName: "Azure Computer Vision"
  version: "1.0.0"
  description: "OCR généraliste Azure Cognitive Services (Read API v3.2). Utilisable comme ANPR sur plaques bien détourées."
  author: "MG-VMS Team"
  license: "MIT"
  categories: [anpr]
  providerGroup: anpr
spec:
  runtime: python
  entrypoint: plugin.py
  className: AzureVisionPlugin
  interface: PlateRecognizer
  compatibility: {mgvms_core: ">=2.30.0,<4.0.0"}
  capabilities: [camera.frame.read, event.write, network.outbound]
  resources: {cpu_cores: 0.5, ram_mb: 128, gpu: none, disk_mb: 10}
  config_schema: config/schema.json
  bus:
    order: 33
