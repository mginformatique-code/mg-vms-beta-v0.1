apiVersion: mgvms.io/v1
kind: Plugin
metadata:
  name: google-vision
  displayName: "Google Cloud Vision"
  version: "1.0.0"
  description: "OCR généraliste Google Cloud Vision. Compatible ANPR sur plaques bien détourées."
  author: "MG-VMS Team"
  license: "MIT"
  categories: [ai, anpr, cloud]
spec:
  runtime: python
  entrypoint: plugin.py
  className: GoogleVisionPlugin
  interface: PlateRecognizer
  compatibility: {mgvms_core: ">=2.30.0,<4.0.0"}
  capabilities: [camera.frame.read, event.write, network.outbound]
  resources: {cpu_cores: 0.5, ram_mb: 128, gpu: none, disk_mb: 10}
  config_schema: config/schema.json
  bus:
    order: 34
